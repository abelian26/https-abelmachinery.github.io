<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Abel Machinery Database</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Admin Panel</h1>
    <p>Add New Machines</p>
</header>

<section>

    <input type="text"
           id="machineName"
           placeholder="Machine Name"
           class="search-box">

    <input type="text"
           id="machineEngine"
           placeholder="Engine"
           class="search-box">

    <input type="text"
           id="machineFuel"
           placeholder="Fuel Consumption"
           class="search-box">

    <input type="text"
           id="machineUsage"
           placeholder="Best Usage"
           class="search-box">

    <input type="text"
           id="machinePerformance"
           placeholder="Performance"
           class="search-box">

    <button onclick="addMachine()">
        Add Machine
    </button>

</section>

<section>

    <h2>Saved Machines</h2>

    <div id="machineList"></div>

</section>

<script src="admin.js"></script>

</body>
</html>
